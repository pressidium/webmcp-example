<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact our Sales Team — WebMCP demo (Declarative API)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <h1>Contact our Sales Team</h1>
        <p id="webmcp-status" class="status status--pending">Checking WebMCP support…</p>
      </header>

      <form
        id="sales-form-contact"
        class="contact-form js-company-form"
        novalidate
        toolname="contact_sales"
        tooldescription="Send an inquiry to the Pressidium sales team about managed WordPress hosting. Use this when the user wants to reach out about plans, pricing, migration, or to schedule a sales call."
        toolautosubmit
      >
        <div class="grid">
          <label class="field">
            <span class="sr-only">Your full name</span>
            <input type="text" name="fullname" placeholder="Your full name" autocomplete="name" required
                   toolparamdescription="The person's full name as they want it to appear on the inquiry." />
          </label>

          <label class="field">
            <span class="sr-only">Your email address</span>
            <input type="email" name="email" placeholder="Your email address" autocomplete="email" required
                   toolparamdescription="Email address where the sales team should reply." />
          </label>

          <label class="field">
            <span class="sr-only">Phone Number</span>
            <input type="tel" name="phone" placeholder="Phone Number" autocomplete="tel"
                   toolparamdescription="Optional phone number, raw as the user wrote it. Country code is fine but not required." />
          </label>

          <label class="field">
            <span class="sr-only">Website URL</span>
            <input type="text" name="website" placeholder="Website URL" autocomplete="url" required
                   toolparamdescription="URL of the website they currently run or want to migrate." />
          </label>
        </div>

        <label class="checkbox">
          <input type="checkbox" name="followup"
                 toolparamdescription="True if the user wants the sales team to schedule a follow-up call. Default false." />
          <span>I would like a Follow Up Call</span>
        </label>

        <label class="field field--full">
          <span class="sr-only">Where did you find us?</span>
          <select name="referrer"
                  toolparamdescription="How the user heard about Pressidium.">
            <option value="" disabled selected>Where did you find us?</option>
            <option value="Search engine">Search engine</option>
            <option value="Friend/Colleague recommendation">Friend/Colleague recommendation</option>
            <option value="Review or other article">Review or other article</option>
            <option value="Advertisement">Advertisement</option>
            <option value="Pressidium Blog">Pressidium Blog</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <div class="grid">
          <label class="field">
            <span class="sr-only">Which Plan are you interested in?</span>
            <select name="plan" required
                    toolparamdescription="Which Pressidium plan the user is interested in. Use 'I am not sure' if unclear.">
              <option value="" disabled selected>Which Plan are you interested in?</option>
              <option value="Enterprise Plans">Enterprise Plans</option>
              <option value="Standard Plans">Standard Plans</option>
              <option value="I am not sure">I am not sure</option>
            </select>
          </label>

          <label class="field">
            <span class="sr-only">Industry</span>
            <select name="industry" required
                    toolparamdescription="The industry the user's site or business is in.">
              <option value="" disabled selected>Industry</option>
              <option value="Agency">Agency</option>
              <option value="Business / Brand">Business / Brand</option>
              <option value="Woocommerce">Woocommerce</option>
              <option value="University / Higher-Ed">University / Higher-Ed</option>
              <option value="LMS / e-Learning">LMS / e-Learning</option>
              <option value="Other">Other</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label class="field">
            <span class="sr-only">Monthly visits (optional)</span>
            <select name="visits"
                    toolparamdescription="Optional monthly visits threshold. Pick the closest match at or above the user's actual traffic.">
              <option value="" disabled selected>Monthly visits (optional)</option>
              <option value="1.000.000">1.000.000</option>
              <option value="1.500.000">1.500.000</option>
              <option value="2.000.000">2.000.000</option>
              <option value="3.000.000">3.000.000</option>
              <option value="5.000.000">5.000.000</option>
              <option value="10.000.000">10.000.000</option>
            </select>
          </label>

          <label class="field">
            <span class="sr-only">Storage needs (optional)</span>
            <select name="storage"
                    toolparamdescription="Optional storage size. Pick the closest match at or above the user's actual needs.">
              <option value="" disabled selected>Storage needs (optional)</option>
              <option value="120GB">120GB</option>
              <option value="240GB">240GB</option>
              <option value="480GB">480GB</option>
              <option value="1T">1T</option>
              <option value="2T">2T</option>
              <option value="4T">4T</option>
            </select>
          </label>
        </div>

        <label class="field field--full">
          <span class="sr-only">Describe your needs</span>
          <textarea name="message" rows="4" placeholder="Describe your needs" required
                    toolparamdescription="Free-text description of the user's needs, in their own words. Pass through what they wrote — do not rephrase or summarise."></textarea>
        </label>

        <label class="checkbox">
          <input type="checkbox" name="privacyConsent" required
                 toolparamdescription="Must be true. Confirms the user has read the Privacy Policy and consents to being contacted." />
          <span>
            I have read and understand the
            <a href="https://pressidium.com/legal/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a>
            and I consent to communications from Pressidium regarding this inquiry.
          </span>
        </label>

        <button type="submit" class="submit">SEND MESSAGE</button>
      </form>

      <div id="thank-you" class="js-thank-you thank-you" hidden>
        <h2>Thank you for contacting us!</h2>
        <p>A member of our Sales Engineering Team will get in touch with you shortly to discuss your needs.</p>
      </div>
    </main>

    <script>
      (function () {
        const status = document.getElementById('webmcp-status');
        if (!status) return;
        if ('modelContext' in navigator) {
          status.textContent = 'Declarative WebMCP — the tool contract is in the HTML attributes below.';
          status.classList.remove('status--pending');
          status.classList.add('status--ok');
        } else {
          status.textContent = 'WebMCP not available in this browser — the form still works, but no tool is exposed.';
          status.classList.remove('status--pending');
          status.classList.add('status--missing');
        }
      })();
    </script>
    <script src="./form.js" defer></script>
  </body>
</html>
